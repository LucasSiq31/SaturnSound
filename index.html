<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saturn Sound</title>

    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="Icons/icon.png" type="image/x-icon">
</head>
<body>
    <div class="container">
        <div class="playlist">
            <div class="cabecalho">
                <h2>Saturn Sound</h2>
                <p id="dadosPlaylist"></p>
            </div>

            <div class="linha"></div>

            <div id="tracks">
                <!-- <div class="track" onclick="start(1)">
                    <div>
                        <img class="capa" src="" alt="">
                        <div>
                            <b>Nome da musica</b>
                            <p>Artista</p>
                        </div>
                    </div>
                    <p>0:00</p>
                </div> -->
            </div>
        </div>

        

        <div class="reprodutor">
            <div id="divFundo">
            </div>

            <div id="vazio">
                <div>
                    Selecione uma música para tocar
                </div>
            </div>

            <div id="player">

                <img id="capa" src="" alt="">
                <div class="info">

                    <div>
                        <div class="marquee-container">
                            <h2 id="nome" data-text=""></h1>
                        </div>

                        <p id="artista"></p>
                    </div>
            
                    <div>
                        <audio id="song" src=""></audio>
                        <input type="range" id="progress" value="0" min="0">
                        <div class="tempo">
                            <p id="min">0:00</p>
                            <p id="max">0:00</p>
                        </div>
                    </div>
            
                    <div class="controls">
                        <button id="less">-5</button>
                        <button id="back" onclick="back()"><img src="Icons/back.png" alt=""></button>
                        <button id="play" onclick="play()"><img src="Icons/play.png" alt=""></button>
                        <button id="pause" onclick="pause()"><img src="Icons/pause.png" alt=""></button>
                        <button id="next" onclick="next()"><img src="Icons/next.png" alt=""></button>
                        <button id="plus">+5</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>

<script src="musicas.js"></script>
<script src="script.js"></script>
